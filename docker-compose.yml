x-app: &app
  build: .
  env_file: .env
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"   # host access for local (non-Docker) development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"   # host access for local (non-Docker) development
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"   # web UI + REST API to read captured emails
      - "127.0.0.1:1025:1025"   # SMTP, for a Django process running on the host
    restart: unless-stopped

  web:
    <<: *app
    environment:
      RUN_MIGRATIONS: "1"
      SEED_DATA: ${SEED_DATA:-1}   # set SEED_DATA=0 in .env to skip demo data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/schema/')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment:
      # Only `web` migrates and seeds, even if .env sets these.
      RUN_MIGRATIONS: "0"
      SEED_DATA: "0"

volumes:
  postgres_data:
  redis_data:
