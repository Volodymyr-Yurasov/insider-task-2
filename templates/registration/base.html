<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Location Map{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f5f7; color: #1f2328; margin: 0; }
    main { max-width: 380px; margin: 12vh auto; background: #fff; padding: 2rem;
           border-radius: 10px; box-shadow: 0 1px 4px rgba(0, 0, 0, .08); }
    h1 { font-size: 1.35rem; margin: 0 0 1rem; }
    label { display: block; font-weight: 600; margin: 1rem 0 .35rem; }
    input { width: 100%; box-sizing: border-box; padding: .6rem; font-size: 1rem;
            border: 1px solid #c9ced6; border-radius: 6px; }
    button { margin-top: 1.25rem; width: 100%; padding: .7rem; font-size: 1rem; border: 0;
             border-radius: 6px; background: #2463eb; color: #fff; cursor: pointer; }
    .errors { color: #b42318; margin: .35rem 0 0; padding-left: 1.1rem; font-size: .9rem; }
    .help { color: #59636e; font-size: .85rem; }
    .help ul { padding-left: 1.1rem; margin: .35rem 0 0; }
  </style>
</head>
<body>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
